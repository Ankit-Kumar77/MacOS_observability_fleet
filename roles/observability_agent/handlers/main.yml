---
- name: Restart OTel Collector
  ansible.builtin.include_tasks:
    file: "{{ role_path }}/../observability_common/tasks/launchd_restart.yml"
  vars:
    launchd_service_label: "{{ otel_collector_launchd_label }}"
    launchd_service_plist: "{{ otel_collector_launchd_plist }}"

- name: Restart SSH state collector
  ansible.builtin.include_tasks:
    file: "{{ role_path }}/../observability_common/tasks/launchd_restart.yml"
  vars:
    launchd_service_label: "{{ otel_ssh_state_launchd_label }}"
    launchd_service_plist: "{{ otel_ssh_state_launchd_plist }}"
