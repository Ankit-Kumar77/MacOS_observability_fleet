---
# Downloads, verifies and unpacks one release into its own versioned directory.
#
# Every component in this project is installed the same way: each release lands
# in a directory named after its version, and a stable symlink is repointed at
# it. That is what makes a version bump an actual upgrade -- a `creates:` guard
# on an unversioned path would silently skip extraction and leave the old
# binary in place.
#
# This file deliberately stops short of creating the symlink and of notifying a
# restart handler. The symlink flip is the moment the running version changes,
# so it belongs with the caller's own handler, next to the service it restarts.
#
# Required variables:
#   observability_archive_component     Human-readable name, used in task names.
#   observability_archive_url           Release URL.
#   observability_archive_checksum      "sha256:..." from the upstream publisher.
#   observability_archive_tmp_path      Where to stage the download.
#   observability_archive_install_dir   Versioned destination directory.
#   observability_archive_binary_path   Absolute path of the binary to verify.
#
# Optional:
#   observability_archive_extra_opts    Extra tar options, e.g.
#                                       ['--strip-components=1'] (default []).
#
# The download step also reads proxy_env (defaults to {} in
# inventories/production/group_vars/all.yml) for Macs that can only reach
# GitHub through a proxy.
#
# The download/extract steps below are skipped entirely once this exact
# version is already installed. Without this check, a re-run after a
# partially-successful prior run (e.g. everything up through this component
# succeeded, but a later task in the same play failed) always re-downloads,
# because the temp archive is deleted on success and leaves nothing for
# get_url's own checksum-match skip to compare against -- even though the
# desired end state already exists on disk. This is safe against the
# "creates: on an unversioned path" footgun above because the path checked
# here is the versioned binary path, not a stable symlink: a version bump
# changes it, so a new version is still correctly downloaded and extracted.

- name: Check whether {{ observability_archive_component }} is already installed
  ansible.builtin.stat:
    path: "{{ observability_archive_binary_path }}"
  register: observability_archive_preinstalled

- name: Download the release archive for {{ observability_archive_component }}
  ansible.builtin.get_url:
    url: "{{ observability_archive_url }}"
    dest: "{{ observability_archive_tmp_path }}"
    checksum: "{{ observability_archive_checksum }}"
    owner: root
    group: wheel
    mode: '0644'
  environment: "{{ proxy_env }}"
  when: not observability_archive_preinstalled.stat.exists

- name: Create the version directory for {{ observability_archive_component }}
  ansible.builtin.file:
    path: "{{ observability_archive_install_dir }}"
    state: directory
    owner: root
    group: wheel
    mode: '0755'
  when: not observability_archive_preinstalled.stat.exists

# ansible.builtin.unarchive refuses to drive macOS's built-in tar: it detects
# /usr/bin/tar as BSD tar (libarchive) and hard-requires GNU tar for its
# idempotency bookkeeping, so it falls through to unzip and fails on every
# .tar.gz here. Shelling out to tar directly sidesteps that module-level
# check entirely -- BSD tar extracts standard .tar.gz archives (including
# --strip-components) just fine, and idempotency is already handled by
# `creates:` below.
- name: Extract the release archive for {{ observability_archive_component }} # noqa: command-instead-of-module
  ansible.builtin.command:
    argv: "{{ ['tar', '-xzf', observability_archive_tmp_path, '-C', observability_archive_install_dir] + (observability_archive_extra_opts | default([])) }}"
    creates: "{{ observability_archive_binary_path }}"
  register: observability_archive_extract
  when: not observability_archive_preinstalled.stat.exists

# tar run as root restores whatever owner/group is baked into the archive,
# which is not guaranteed to be root:wheel, so normalize it explicitly --
# unarchive did this itself via its owner/group parameters.
- name: Normalize ownership of the extracted release for {{ observability_archive_component }}
  ansible.builtin.file:
    path: "{{ observability_archive_install_dir }}"
    owner: root
    group: wheel
    recurse: true
  when: observability_archive_extract is changed

- name: Stat the installed binary for {{ observability_archive_component }}
  ansible.builtin.stat:
    path: "{{ observability_archive_binary_path }}"
  register: observability_archive_binary

- name: Assert the archive produced a binary for {{ observability_archive_component }}
  ansible.builtin.assert:
    that:
      - observability_archive_binary.stat.exists
      - observability_archive_binary.stat.isreg
    fail_msg: >-
      The {{ observability_archive_component }} archive did not extract
      {{ observability_archive_binary_path }}.

- name: Remove the downloaded archive for {{ observability_archive_component }}
  ansible.builtin.file:
    path: "{{ observability_archive_tmp_path }}"
    state: absent
  when: not observability_archive_preinstalled.stat.exists
