---
# Monitoring Mac secrets and environment overrides.
#
# Versions, checksums, ports, paths and readiness tuning are role defaults in
# roles/observability_server/defaults/main.yml. Override them here only when
# this environment genuinely requires something different.
#
# Requires vault_grafana_admin_password. Create it with:
#   ansible-vault encrypt_string 'a-strong-password' --name 'vault_grafana_admin_password'
grafana_admin_password: "{{ vault_grafana_admin_password }}"
