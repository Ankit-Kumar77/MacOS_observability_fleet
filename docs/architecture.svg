<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Mac Mini observability architecture</title>
  <desc id="desc">Apple Silicon Mac Minis run OpenTelemetry Collector hostmetrics. Collectors send metrics using OTLP over HTTP to VictoriaMetrics on a monitoring Mac Mini. Grafana visualizes the stored metrics.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8fbfd"/><stop offset="1" stop-color="#eef5f8"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#176b87"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #153144; }
      .title { font-size: 34px; font-weight: 700; } .subtitle { font-size: 19px; fill: #526d7c; }
      .container { fill: #ffffff; stroke: #9dbbc9; stroke-width: 2; } .container-head { fill: #153f57; }
      .agent { fill: #e8f6f8; stroke: #53a2b5; stroke-width: 2; } .store { fill: #eaf1fe; stroke: #688cc1; stroke-width: 2; }
      .label { font-size: 21px; font-weight: 700; } .body { font-size: 17px; fill: #4d6878; } .small { font-size: 15px; fill: #4d6878; } .on-dark { fill: #ffffff; }
      .flow { fill: none; stroke: #176b87; stroke-width: 4; marker-end: url(#arrow); } .branch { fill: none; stroke: #176b87; stroke-width: 4; } .guide { fill: none; stroke: #91b1bf; stroke-width: 2; stroke-dasharray: 7 7; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <text x="90" y="88" class="title">Mac Mini Observability</text>
  <text x="90" y="122" class="subtitle">OpenTelemetry-native host metrics for Apple Silicon macOS</text>

  <rect x="80" y="205" width="570" height="500" rx="18" class="container"/>
  <rect x="80" y="205" width="570" height="72" rx="18" class="container-head"/>
  <text x="365" y="250" text-anchor="middle" class="on-dark" font-size="24" font-weight="700">Monitored Mac Minis</text>
  <text x="365" y="312" text-anchor="middle" class="body">One collector on every monitored Mac</text>

  <rect x="120" y="356" width="220" height="250" rx="13" class="agent"/>
  <text x="230" y="397" text-anchor="middle" class="label">Mac Mini 02</text>
  <rect x="145" y="430" width="170" height="100" rx="9" fill="#ffffff" stroke="#89bfca" stroke-width="1.5"/>
  <text x="230" y="467" text-anchor="middle" class="label" font-size="18">OTel Collector</text>
  <text x="230" y="496" text-anchor="middle" class="body">hostmetrics</text>
  <text x="230" y="570" text-anchor="middle" class="small">CPU / memory / disk</text>

  <rect x="390" y="356" width="220" height="250" rx="13" class="agent"/>
  <text x="500" y="397" text-anchor="middle" class="label">Mac Mini 03 through N</text>
  <rect x="415" y="430" width="170" height="100" rx="9" fill="#ffffff" stroke="#89bfca" stroke-width="1.5"/>
  <text x="500" y="467" text-anchor="middle" class="label" font-size="18">OTel Collector</text>
  <text x="500" y="496" text-anchor="middle" class="body">hostmetrics</text>
  <text x="500" y="570" text-anchor="middle" class="small">same agent role</text>

  <path d="M340 480 H365 V650 H740" class="branch"/>
  <path d="M500 606 V650 H740 V480 H840" class="flow"/>
  <text x="665" y="620" text-anchor="middle" class="body">OTLP / HTTP</text>
  <text x="665" y="642" text-anchor="middle" class="small">/opentelemetry/v1/metrics</text>

  <rect x="800" y="205" width="700" height="500" rx="18" class="container"/>
  <rect x="800" y="205" width="700" height="72" rx="18" class="container-head"/>
  <text x="1150" y="250" text-anchor="middle" class="on-dark" font-size="24" font-weight="700">Monitoring Mac Mini</text>

  <rect x="850" y="350" width="290" height="175" rx="13" class="store"/>
  <text x="995" y="402" text-anchor="middle" class="label">VictoriaMetrics</text>
  <text x="995" y="436" text-anchor="middle" class="body">OTLP/HTTP ingestion</text>
  <text x="995" y="468" text-anchor="middle" class="body">port 8428</text>
  <text x="995" y="501" text-anchor="middle" class="small">metric storage</text>

  <rect x="1210" y="350" width="240" height="175" rx="13" class="store"/>
  <text x="1330" y="402" text-anchor="middle" class="label">Grafana</text>
  <text x="1330" y="436" text-anchor="middle" class="body">dashboards</text>
  <text x="1330" y="468" text-anchor="middle" class="body">port 3000</text>
  <text x="1330" y="501" text-anchor="middle" class="small">VictoriaMetrics datasource</text>

  <path d="M1140 438 H1200" class="flow"/>
  <text x="1168" y="414" text-anchor="middle" class="small">query</text>
  <path d="M850 575 H1450" class="guide"/>
  <text x="1150" y="625" text-anchor="middle" class="body">Inventory supplies the monitoring-server address to every collector.</text>
  <text x="1150" y="658" text-anchor="middle" class="small">Pipeline: hostmetrics -&gt; resourcedetection -&gt; batch -&gt; otlphttp -&gt; VictoriaMetrics</text>

  <text x="90" y="810" class="small">All services are installed and managed on macOS with the existing Ansible roles and launchd plists.</text>
</svg>
