<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #f8f9fa; }
      .box { fill: #ffffff; stroke: #ced4da; stroke-width: 2; rx: 8; }
      .box-server { fill: #e7f5ff; stroke: #339af0; stroke-width: 2; rx: 8; }
      .box-agent { fill: #f3f0ff; stroke: #845ef7; stroke-width: 2; rx: 8; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 16px; font-weight: bold; fill: #212529; }
      .text-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 14px; fill: #495057; }
      .text-white { fill: #ffffff; }
      .line { stroke: #adb5bd; stroke-width: 2; fill: none; stroke-dasharray: 5,5; }
      .line-solid { stroke: #495057; stroke-width: 2; fill: none; }
      .arrow { fill: #495057; }
      .header-box { fill: #343a40; rx: 4; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" class="arrow" />
    </marker>
  </defs>

  <rect width="800" height="500" class="bg" rx="12" />

  <!-- Monitoring Server -->
  <rect x="250" y="40" width="300" height="180" class="box-server" />
  <rect x="250" y="40" width="300" height="40" class="header-box" />
  <text x="400" y="65" class="text-title text-white" text-anchor="middle">Monitoring Mac (Server)</text>

  <rect x="280" y="100" width="240" height="40" class="box" />
  <text x="400" y="125" class="text-title" text-anchor="middle">VictoriaMetrics</text>
  
  <rect x="280" y="160" width="240" height="40" class="box" />
  <text x="400" y="185" class="text-title" text-anchor="middle">Grafana</text>

  <path d="M 400 160 L 400 145" class="line-solid" marker-end="url(#arrowhead)" />

  <!-- Monitored Nodes -->
  <!-- Node 1 -->
  <rect x="60" y="300" width="200" height="150" class="box-agent" />
  <rect x="60" y="300" width="200" height="40" class="header-box" />
  <text x="160" y="325" class="text-title text-white" text-anchor="middle">Mac Mini 02</text>

  <rect x="80" y="355" width="160" height="35" class="box" />
  <text x="160" y="378" class="text-sub" text-anchor="middle">Node Exporter</text>

  <rect x="80" y="400" width="160" height="35" class="box" />
  <text x="160" y="423" class="text-sub" text-anchor="middle">OpenTelemetry</text>

  <path d="M 160 390 L 160 395" class="line-solid" marker-end="url(#arrowhead)" />

  <!-- Node 2 -->
  <rect x="300" y="300" width="200" height="150" class="box-agent" />
  <rect x="300" y="300" width="200" height="40" class="header-box" />
  <text x="400" y="325" class="text-title text-white" text-anchor="middle">Mac Mini 03</text>

  <rect x="320" y="355" width="160" height="35" class="box" />
  <text x="400" y="378" class="text-sub" text-anchor="middle">Node Exporter</text>

  <rect x="320" y="400" width="160" height="35" class="box" />
  <text x="400" y="423" class="text-sub" text-anchor="middle">OpenTelemetry</text>

  <path d="M 400 390 L 400 395" class="line-solid" marker-end="url(#arrowhead)" />

  <!-- Node N -->
  <rect x="540" y="300" width="200" height="150" class="box-agent" />
  <rect x="540" y="300" width="200" height="40" class="header-box" />
  <text x="640" y="325" class="text-title text-white" text-anchor="middle">Mac Mini N</text>

  <rect x="560" y="355" width="160" height="35" class="box" />
  <text x="640" y="378" class="text-sub" text-anchor="middle">Node Exporter</text>

  <rect x="560" y="400" width="160" height="35" class="box" />
  <text x="640" y="423" class="text-sub" text-anchor="middle">OpenTelemetry</text>

  <path d="M 640 390 L 640 395" class="line-solid" marker-end="url(#arrowhead)" />

  <!-- Connections -->
  <path d="M 160 300 L 160 260 L 400 260 L 400 225" class="line-solid" marker-end="url(#arrowhead)" />
  <path d="M 400 300 L 400 225" class="line-solid" marker-end="url(#arrowhead)" />
  <path d="M 640 300 L 640 260 L 400 260 L 400 225" class="line-solid" />

  <rect x="320" y="248" width="160" height="24" fill="#ffffff" rx="12" stroke="#adb5bd" />
  <text x="400" y="265" class="text-sub" text-anchor="middle">Remote Write (OTLP)</text>
</svg>
