---
# Idempotently bootstraps a LaunchDaemon into the system domain if it is not
# already loaded. ansible.builtin.service has no macOS implementation --
# "get_service_tools not implemented on target platform" -- so this drives
# launchctl directly, per the refactor specified in LAUNCHD_TROUBLESHOOTING.md,
# now that it has been exercised on a real Mac.
#
# Required variables:
#   launchd_service_label   The Label declared in the plist, e.g.
#                           com.observability.victoriametrics.
#   launchd_service_plist   Absolute path to the rendered plist.
#
# RunAtLoad and KeepAlive are always true in launchd_daemon.plist.j2, so a
# bootstrapped daemon starts immediately and persists across reboots without
# a separate "enable" step.

- name: Check whether {{ launchd_service_label }} is loaded
  ansible.builtin.command:
    cmd: "launchctl print system/{{ launchd_service_label }}"
  register: observability_launchd_status
  changed_when: false
  failed_when: false

- name: Bootstrap {{ launchd_service_label }} when not loaded
  ansible.builtin.command:
    cmd: "launchctl bootstrap system {{ launchd_service_plist }}"
  when: observability_launchd_status.rc != 0
  changed_when: true
