---
# KeepAlive restarts a crashing collector forever, so "loaded" alone proves
# little; require launchd to report it running in this user's domain. The SSH
# state job is periodic (StartInterval) and is idle between runs, so for it
# being loaded is the right check.
- name: Verify the collector LaunchAgent is running in the per-user launchd domain
  ansible.builtin.command:
    cmd: "launchctl print {{ launchd_domain }}/{{ otel_collector_launchd_label }}"
  register: observability_agent_collector_state
  until: observability_agent_collector_state.rc == 0 and 'state = running' in observability_agent_collector_state.stdout
  retries: 5
  delay: 2
  changed_when: false
  tags: ['verify']

- name: Verify the SSH state LaunchAgent is loaded in the per-user launchd domain
  ansible.builtin.command:
    cmd: "launchctl print {{ launchd_domain }}/{{ otel_ssh_state_launchd_label }}"
  changed_when: false
  when: otel_ssh_monitoring_enabled | bool
  tags: ['verify']

# Runs in this Ansible (SSH) session, which macOS exempts from Local Network
# Privacy; the collector LaunchAgent is not exempt, so this passing does not
# prove the collector can connect. The end-to-end check below does.
- name: Verify monitoring server is reachable
  ansible.builtin.wait_for:
    host: "{{ monitoring_server_address }}"
    port: "{{ victoriametrics_port }}"
    timeout: 10
  tags: ['verify']

- name: Validate OpenTelemetry configuration
  ansible.builtin.command:
    cmd: "{{ bin_dir }}/otelcol-contrib validate --config={{ etc_dir }}/otel-config.yaml"
  register: observability_agent_validate
  changed_when: false
  tags: ['verify']

# RunAtLoad runs the script as soon as launchd loads it; allow two intervals.
- name: Wait for the first SSH state snapshot
  ansible.builtin.wait_for:
    path: "{{ otel_ssh_state_dir }}/ssh-state.json"
    timeout: "{{ (otel_ssh_check_interval | int) * 2 + 10 }}"
  when: otel_ssh_monitoring_enabled | bool
  tags: ['verify']

# End-to-end check: the collector was just restarted, so allow a couple of
# collection intervals before expecting data to have landed. If nothing
# arrives, the rescue reads the collector's own counters and log and fails
# with a diagnosis instead of a bare empty query result.
- name: Confirm host metrics reach VictoriaMetrics
  tags: ['verify']
  block:
    - name: Wait for host metrics to arrive in VictoriaMetrics
      ansible.builtin.uri:
        url: "http://{{ monitoring_server_address }}:{{ victoriametrics_port }}/api/v1/query?query=count(count%20by%20(host_name)%20(system_memory_usage_bytes))"
        url_username: "{{ victoriametrics_auth_username if victoriametrics_auth_enabled else omit }}"
        url_password: "{{ victoriametrics_auth_password if victoriametrics_auth_enabled else omit }}"
        force_basic_auth: "{{ victoriametrics_auth_enabled }}"
        method: GET
        status_code: 200
      register: observability_agent_vm_hosts
      until: observability_agent_vm_hosts.json is defined and (observability_agent_vm_hosts.json.data.result | default([]) | length) > 0
      retries: 6
      delay: 10
      no_log: "{{ victoriametrics_auth_enabled }}"

  rescue:
    - name: Read the collector's own export counters
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ otel_internal_metrics_port }}/metrics"
        return_content: true
      register: observability_agent_self_metrics
      failed_when: false

    - name: Read the collector's recent errors
      ansible.builtin.command:
        cmd: "tail -n 400 {{ log_dir }}/otelcol.err.log"
      register: observability_agent_collector_log
      changed_when: false
      failed_when: false

    # "Verify monitoring server is reachable" above connected from this
    # Ansible SSH session. macOS exempts programs run over SSH (and root, and
    # launchd daemons) from Local Network Privacy, but not launchd agents; so
    # "SSH session connects, collector LaunchAgent gets no route to host" is
    # that policy, not the network. See docs/LAUNCHAGENT_VARIANT.md.
    - name: Fail with a diagnosis of why no metrics arrived
      ansible.builtin.fail:
        msg: >-
          {%- set lines = (observability_agent_self_metrics.content | default('')).splitlines() %}
          {%- set sent = lines | select('match', '^otelcol_exporter_sent_metric_points') | map('regex_replace', '^.*\\s', '') | map('float') | sum | int %}
          {%- set failed = lines | select('match', '^otelcol_exporter_send_failed_metric_points') | map('regex_replace', '^.*\\s', '') | map('float') | sum | int %}
          {%- set accepted = lines | select('match', '^otelcol_receiver_accepted_metric_points') | map('regex_replace', '^.*\\s', '') | map('float') | sum | int %}
          {%- set errors = observability_agent_collector_log.stdout_lines | default([]) | select('search', 'error') | list %}
          No host metrics reached VictoriaMetrics at
          {{ monitoring_server_address }}:{{ victoriametrics_port }}.
          Collector counters (127.0.0.1:{{ otel_internal_metrics_port }}):
          {{ 'unavailable' if observability_agent_self_metrics.status | default(-1) != 200 else
             'accepted ' ~ accepted ~ ', exported ' ~ sent ~ ', export failed ' ~ failed }}.
          {% if errors | select('search', 'no route to host') | list | length > 0 %}
          The collector LaunchAgent gets "connect: no route to host" for
          {{ monitoring_server_address }}:{{ victoriametrics_port }}, yet this
          Ansible SSH session connected to the same address and port moments
          ago. On macOS 15 and later that is Local Network Privacy (Apple
          TN3179): root, launchd daemons and programs run over SSH are exempt,
          launchd agents are not and need this user's Local Network privilege.
          It cannot be granted without the console or an administrator, and
          this playbook does not try. Either (1) log in at this Mac's console
          as {{ ansible_facts['user_id'] }} and allow otelcol-contrib under
          System Settings > Privacy & Security > Local Network (repeat after
          each collector upgrade), or (2) have an administrator exempt the
          monitoring Mac's address and restart this Mac, then re-run this play:
          sudo defaults write com.apple.network.local-network
          AllowedEthernetLocalNetworkAddresses -array-add
          "{{ monitoring_server_address }}/32" (AllowedWiFiLocalNetworkAddresses
          on Wi-Fi). Details: docs/LAUNCHAGENT_VARIANT.md, "Local Network Privacy".
          {% else %}
          Last collector error: {{ (errors | last | default('none in ' ~ log_dir ~ '/otelcol.err.log'))[-400:] }}
          {% endif %}

- name: List the hosts currently reporting metrics
  ansible.builtin.uri:
    url: "http://{{ monitoring_server_address }}:{{ victoriametrics_port }}/api/v1/label/host_name/values"
    url_username: "{{ victoriametrics_auth_username if victoriametrics_auth_enabled else omit }}"
    url_password: "{{ victoriametrics_auth_password if victoriametrics_auth_enabled else omit }}"
    force_basic_auth: "{{ victoriametrics_auth_enabled }}"
    method: GET
    status_code: 200
  register: observability_agent_vm_hostnames
  changed_when: false
  no_log: "{{ victoriametrics_auth_enabled }}"
  tags: ['verify']

# The collector reports the OS hostname, which may carry a .local suffix and so
# need not equal inventory_hostname. Surface the list rather than asserting an
# exact match, so an operator can confirm this Mac appears.
- name: Report agent verification success
  ansible.builtin.debug:
    msg: >-
      Collector configuration is valid, the collector is running as a
      LaunchAgent in {{ launchd_domain }}, and metrics are reaching
      VictoriaMetrics on port {{ victoriametrics_port }}.
      Hosts currently reporting: {{ observability_agent_vm_hostnames.json.data | default([]) | join(', ') }}
  tags: ['verify']
