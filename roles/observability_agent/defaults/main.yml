---
# Filesystem layout. Everything is owned by the connecting Ansible user; no
# sudo is used anywhere. user_dir is that user's home directory, taken from
# gathered facts. Override in inventory group_vars to relocate the stack, but
# keep it out of ~/Desktop, ~/Documents and ~/Downloads: macOS privacy
# controls (TCC) block background LaunchAgents from reading those.
base_dir: "{{ ansible_facts['user_dir'] }}/tools/observability"
bin_dir: "{{ base_dir }}/bin"
etc_dir: "{{ base_dir }}/etc"
var_dir: "{{ base_dir }}/var"
log_dir: "{{ var_dir }}/log"
# Release archives are staged here, not in the shared /tmp, and removed after
# extraction.
download_dir: "{{ var_dir }}/downloads"

# Per-user launchd. Plists go in the user's own LaunchAgents directory and are
# loaded into a per-user domain, never system/.
#
#   user  (default) user/<uid>: loadable over SSH without a console login;
#         plists carry LimitLoadToSessionType Background.
#   gui   gui/<uid>: only exists while this user is logged in at the console;
#         plists carry Aqua, so launchd also loads them at console login.
#
# See "LaunchAgent lifecycle" in docs/LAUNCHAGENT_VARIANT.md for what each
# means across logout and reboot.
launch_agents_dir: "{{ ansible_facts['user_dir'] }}/Library/LaunchAgents"
launchd_domain_type: user
launchd_domain: "{{ launchd_domain_type }}/{{ ansible_facts['user_uid'] }}"
# Distinct from the system-level deployment's com.observability.* LaunchDaemon
# labels, so the two can never be mistaken for each other in launchctl output,
# logs or plist names when they run side by side.
launchd_label_prefix: com.observability.user
otel_collector_launchd_label: "{{ launchd_label_prefix }}.otelcol"
otel_collector_launchd_plist: "{{ launch_agents_dir }}/{{ otel_collector_launchd_label }}.plist"
otel_ssh_state_launchd_label: "{{ launchd_label_prefix }}.sshstate"
otel_ssh_state_launchd_plist: "{{ launch_agents_dir }}/{{ otel_ssh_state_launchd_label }}.plist"
# LaunchDaemon labels of the system-level deployment for the same services.
# Only ever read (stat / launchctl print) by preflight, never modified.
observability_legacy_daemon_labels:
  - com.observability.otelcol
  - com.observability.sshstate

# OpenTelemetry Collector Contrib.
#
# 0.159.0 is the MINIMUM usable version on macOS. In 0.98.0 the hostmetrics
# `cpu` and `disk` scrapers return "not implemented yet" on darwin and emit no
# data at all, which left the CPU and disk dashboard panels permanently empty.
# Verified on darwin/arm64: 0.159.0 scrapes all six scrapers with no errors.
# Do not downgrade below 0.159.0 without re-testing on a real Mac.
otel_collector_version: "0.159.0"
otel_collector_download_url: "https://github.com/open-telemetry/opentelemetry-collector-releases/releases/download/v{{ otel_collector_version }}/otelcol-contrib_{{ otel_collector_version }}_darwin_arm64.tar.gz"
# Upstream-published SHA256 (…_darwin_arm64.tar.gz.sha256). Update on version bump.
otel_collector_checksum: "sha256:7e317b75b1b087ba2150bf95d79e39a394d0d091f1231af6bbebee895d200375"
otel_collector_install_dir: "{{ bin_dir }}/otelcol-contrib-{{ otel_collector_version }}"

otel_collection_interval: 15s

# The collector's own telemetry (otelcol_receiver_accepted_metric_points,
# otelcol_exporter_sent/send_failed_metric_points, ...), served on loopback
# only at http://127.0.0.1:<port>/metrics. The collector's built-in default is
# 8888, which the system-level collector already holds on Macs running it; a
# second collector on 8888 fails to start ("address already in use") and
# KeepAlive restarts it forever. 18888 keeps the two apart in every mode, and
# preflight checks it is free. Agent verification reads it to tell "nothing
# scraped" from "scraped but not exported".
otel_internal_metrics_port: 18888

# Network latency from each monitored Mac to the monitoring Mac. The tcp_check
# receiver times a TCP connect to VictoriaMetrics (monitoring_server_address:
# victoriametrics_port) every otel_collection_interval - the same host and port
# the metrics themselves are exported to, so no extra firewall rule is needed.
# Emits tcpcheck_duration_milliseconds (whole milliseconds) and
# tcpcheck_status_ratio (1 = connected, 0 = failed), labelled with host_name by
# resourcedetection like every other metric. Disable to drop both series.
otel_latency_check_enabled: true

# SSH access state. A per-user LaunchAgent (otel_ssh_state_launchd_label) runs
# templates/ssh_state.sh.j2 every otel_ssh_check_interval seconds as the
# deployment user and writes a one-line OTLP/JSON snapshot into
# otel_ssh_state_dir; the collector's otlp_json_file receiver picks it up and
# sends it through the normal pipeline. See the script header, and the SSH
# capability matrix in docs/LAUNCHAGENT_VARIANT.md, for what an unprivileged
# collector can and cannot see.
otel_ssh_monitoring_enabled: true
otel_ssh_check_interval: 30
otel_ssh_port: 22
# The launchd job Remote Login loads on macOS.
otel_ssh_launchd_label: com.openssh.sshd
# Seconds to wait for sshd's protocol banner on loopback.
otel_ssh_banner_timeout: 3
# false keeps the service/port/session-count gauges but drops the per-session
# series (user name, source address, tty, login time).
otel_ssh_session_details_enabled: true
# 0700, user-owned: the snapshot names the users logged in and where from.
otel_ssh_state_dir: "{{ var_dir }}/ssh-state"
otel_ssh_state_program_arguments:
  - "{{ bin_dir }}/observability-ssh-state"

# launchd ProgramArguments, rendered into the shared plist template.
otel_collector_program_arguments:
  - "{{ bin_dir }}/otelcol-contrib"
  - "--config={{ etc_dir }}/otel-config.yaml"

# macOS/APFS: every volume in a container reports the SAME container-wide
# capacity, so scraping them all multiplies series without adding any signal.
# "/" and "/System/Volumes/Data" report identical usage; everything else here
# is a synthetic or helper volume. Values are regexps (Go RE2 - no lookahead).
otel_filesystem_exclude_mount_points:
  - '/System/Volumes/Preboot'
  - '/System/Volumes/Update.*'
  - '/System/Volumes/VM'
  - '/System/Volumes/Hardware'
  - '/System/Volumes/xarts'
  - '/System/Volumes/iSCPreboot'
  - '/System/Volumes/Data/home'
  - '/Library/Developer/CoreSimulator/Volumes/.*'
  - '/dev'
otel_filesystem_exclude_fs_types:
  - autofs
  - devfs
