---
all:
  children:
    monitoring_server:
      hosts:
        monitoring-mac:
          ansible_host: REPLACE_WITH_SERVER_IP
          ansible_user: REPLACE_WITH_SSH_USER

    monitored_nodes:
      hosts:
        mac-mini-02:
          ansible_host: REPLACE_WITH_NODE2_IP
          ansible_user: REPLACE_WITH_SSH_USER
        mac-mini-03:
          ansible_host: REPLACE_WITH_NODE3_IP
          ansible_user: REPLACE_WITH_SSH_USER
      # Macs running mlx_lm.server or mlx_vlm.server (framework detected per
      # host; llm_framework overrides it): enable LLM observability per host, e.g.
      #   mac-mini-02:
      #     ...
      #     llm_observability_enabled: true
      #     mlx_server_port: 8080
      # or with a child group plus group_vars/<group>.yml. See
      # docs/LLM_OBSERVABILITY.md.
