<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title description">
  <title id="title">Mac Mini OpenTelemetry observability architecture</title>
  <desc id="description">Each monitored Mac Mini runs an OpenTelemetry Collector with the hostmetrics receiver. Metrics travel over OTLP HTTP to VictoriaMetrics on a central monitoring Mac Mini, where Grafana visualizes them.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16647e"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #173447; }
      .page-title { font-size: 34px; font-weight: 700; }
      .page-subtitle { font-size: 18px; fill: #597080; }
      .group { fill: #ffffff; stroke: #7f9cab; stroke-width: 2; }
      .group-head { fill: #173f55; }
      .agent { fill: #f9fcfd; stroke: #8ca9b7; stroke-width: 2; }
      .agent-head { fill: #e6f2f6; }
      .component { fill: #edf7f9; stroke: #59a1b3; stroke-width: 2; }
      .storage { fill: #edf3fc; stroke: #668cc2; stroke-width: 2; }
      .heading { font-size: 23px; font-weight: 700; }
      .component-title { font-size: 20px; font-weight: 700; }
      .body { font-size: 17px; fill: #526c7b; }
      .small { font-size: 15px; fill: #526c7b; }
      .on-dark { fill: #ffffff; }
      .flow { fill: none; stroke: #16647e; stroke-width: 4; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="#f7fafc"/>
  <text x="90" y="72" class="page-title">Mac Mini Observability</text>
  <text x="90" y="104" class="page-subtitle">Every Mac Mini sends host metrics to one central monitoring Mac.</text>

  <!-- Central monitoring system -->
  <rect x="410" y="145" width="780" height="405" rx="16" class="group"/>
  <rect x="410" y="145" width="780" height="68" rx="16" class="group-head"/>
  <text x="800" y="188" text-anchor="middle" class="heading on-dark">MONITORING MAC</text>

  <rect x="620" y="255" width="360" height="100" rx="10" class="storage"/>
  <text x="800" y="297" text-anchor="middle" class="heading">VictoriaMetrics</text>
  <text x="800" y="326" text-anchor="middle" class="body">stores host metrics / port 8428</text>

  <path d="M800 355 V405" class="flow"/>
  <text x="825" y="388" class="small">metrics</text>

  <rect x="620" y="420" width="360" height="100" rx="10" class="storage"/>
  <text x="800" y="462" text-anchor="middle" class="heading">Grafana</text>
  <text x="800" y="491" text-anchor="middle" class="body">visualizes metrics / port 3000</text>

  <!-- Three identical monitored Mac cards -->
  <rect x="90" y="735" width="350" height="205" rx="14" class="agent"/>
  <rect x="90" y="735" width="350" height="54" rx="14" class="agent-head"/>
  <text x="265" y="770" text-anchor="middle" class="component-title">Mac Mini 01</text>
  <rect x="125" y="818" width="280" height="82" rx="9" class="component"/>
  <text x="265" y="852" text-anchor="middle" class="component-title">OpenTelemetry Collector</text>
  <text x="265" y="880" text-anchor="middle" class="body">hostmetrics receiver</text>

  <rect x="625" y="735" width="350" height="205" rx="14" class="agent"/>
  <rect x="625" y="735" width="350" height="54" rx="14" class="agent-head"/>
  <text x="800" y="770" text-anchor="middle" class="component-title">Mac Mini 02</text>
  <rect x="660" y="818" width="280" height="82" rx="9" class="component"/>
  <text x="800" y="852" text-anchor="middle" class="component-title">OpenTelemetry Collector</text>
  <text x="800" y="880" text-anchor="middle" class="body">hostmetrics receiver</text>

  <rect x="1160" y="735" width="350" height="205" rx="14" class="agent"/>
  <rect x="1160" y="735" width="350" height="54" rx="14" class="agent-head"/>
  <text x="1335" y="770" text-anchor="middle" class="component-title">Mac Mini N</text>
  <rect x="1195" y="818" width="280" height="82" rx="9" class="component"/>
  <text x="1335" y="852" text-anchor="middle" class="component-title">OpenTelemetry Collector</text>
  <text x="1335" y="880" text-anchor="middle" class="body">hostmetrics receiver</text>

  <!-- Shared OTLP/HTTP route. The trunk stays outside both containers. -->
  <path d="M265 735 V655" class="flow"/>
  <path d="M800 735 V655" class="flow"/>
  <path d="M1335 735 V655 H265 V305 H620" class="flow"/>
  <text x="800" y="620" text-anchor="middle" class="component-title">OTLP / HTTP</text>
  <text x="800" y="645" text-anchor="middle" class="small">/opentelemetry/v1/metrics</text>

  <text x="800" y="980" text-anchor="middle" class="small">Data flow: Mac Mini -&gt; OpenTelemetry Collector -&gt; hostmetrics -&gt; OTLP/HTTP -&gt; VictoriaMetrics -&gt; Grafana</text>
</svg>
