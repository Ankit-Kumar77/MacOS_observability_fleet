---
# Base installation directory for observability stack
# IMPORTANT: Confirm this path is suitable for your Mac Minis before deployment.
base_dir: /opt/observability
bin_dir: "{{ base_dir }}/bin"
etc_dir: "{{ base_dir }}/etc"
var_dir: "{{ base_dir }}/var"
log_dir: "{{ var_dir }}/log"
victoriametrics_port: 8428

# The address of the monitoring server.
# Dynamically derived from the first host in the monitoring_server group.
monitoring_server_address: "{{ hostvars[groups['monitoring_server'][0]]['ansible_host'] }}"
