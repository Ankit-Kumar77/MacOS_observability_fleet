---
- name: Download OpenTelemetry Collector archive
  ansible.builtin.get_url:
    url: "{{ otel_collector_download_url }}"
    dest: "/tmp/otelcol.tar.gz"
    mode: '0644'

- name: Extract OpenTelemetry Collector
  ansible.builtin.unarchive:
    src: "/tmp/otelcol.tar.gz"
    dest: "{{ bin_dir }}"
    remote_src: yes
    creates: "{{ bin_dir }}/otelcol-contrib"
  notify: Restart OTel Collector

- name: Confirm OpenTelemetry Collector binary was extracted
  ansible.builtin.stat:
    path: "{{ bin_dir }}/otelcol-contrib"
  register: _otelcol_binary

- name: Assert OpenTelemetry Collector binary is available
  ansible.builtin.assert:
    that:
      - _otelcol_binary.stat.exists
      - _otelcol_binary.stat.isreg
    fail_msg: "The otelcol-contrib archive did not extract {{ bin_dir }}/otelcol-contrib."

- name: Generate OTel Collector configuration
  ansible.builtin.template:
    src: otel-config.yaml.j2
    dest: "{{ etc_dir }}/otel-config.yaml"
    owner: root
    group: wheel
    mode: '0644'
  notify: Restart OTel Collector

- name: Generate OTel Collector launchd plist
  ansible.builtin.template:
    src: otelcol.plist.j2
    dest: /Library/LaunchDaemons/com.observability.otelcol.plist
    owner: root
    group: wheel
    mode: '0644'
  notify: Restart OTel Collector

- name: Ensure OTel Collector is started and enabled
  ansible.builtin.service:
    name: com.observability.otelcol
    state: started
    enabled: yes
