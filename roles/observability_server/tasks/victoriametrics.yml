---
# Kept in a 0600 file rather than passed as a launchd argument, so the secret
# is absent from the world-readable plist and from `ps` output.
- name: Write the VictoriaMetrics basic-auth password file
  ansible.builtin.copy:
    content: "{{ victoriametrics_auth_password }}"
    dest: "{{ etc_dir }}/victoriametrics-auth-password"
    owner: root
    group: wheel
    mode: '0600'
  no_log: true
  when: victoriametrics_auth_enabled
  notify: Restart VictoriaMetrics

- name: Install the VictoriaMetrics release
  ansible.builtin.include_role:
    name: observability_common
    tasks_from: install_versioned_archive
  vars:
    observability_archive_component: VictoriaMetrics
    observability_archive_url: "{{ victoriametrics_download_url }}"
    observability_archive_checksum: "{{ victoriametrics_checksum }}"
    observability_archive_tmp_path: "/tmp/victoria-metrics-{{ victoriametrics_version }}.tar.gz"
    observability_archive_install_dir: "{{ victoriametrics_install_dir }}"
    observability_archive_binary_path: "{{ victoriametrics_install_dir }}/victoria-metrics-prod"

# The symlink flip -- not the extraction -- is the moment the running version
# changes, which is why the restart is notified from here.
- name: Point the active VictoriaMetrics binary at this version
  ansible.builtin.file:
    src: "{{ victoriametrics_install_dir }}/victoria-metrics-prod"
    dest: "{{ bin_dir }}/victoria-metrics-prod"
    state: link
    owner: root
    group: wheel
    follow: false
    force: true
  notify: Restart VictoriaMetrics

- name: Generate VictoriaMetrics launchd plist
  ansible.builtin.template:
    src: "{{ role_path }}/../observability_common/templates/launchd_daemon.plist.j2"
    dest: /Library/LaunchDaemons/com.observability.victoriametrics.plist
    owner: root
    group: wheel
    mode: '0644'
  vars:
    launchd_label: com.observability.victoriametrics
    launchd_program_arguments: "{{ victoriametrics_base_arguments + (victoriametrics_auth_arguments if victoriametrics_auth_enabled else []) }}"
    launchd_stdout_log: "{{ log_dir }}/victoriametrics.out.log"
    launchd_stderr_log: "{{ log_dir }}/victoriametrics.err.log"
  notify: Restart VictoriaMetrics

- name: Ensure VictoriaMetrics is started and enabled
  ansible.builtin.include_role:
    name: observability_common
    tasks_from: launchd_ensure_started
  vars:
    launchd_service_label: com.observability.victoriametrics
    launchd_service_plist: /Library/LaunchDaemons/com.observability.victoriametrics.plist
