---
# Filesystem layout. Everything is owned by the connecting Ansible user; no
# sudo is used anywhere. user_dir is that user's home directory, taken from
# gathered facts. Override in inventory group_vars to relocate the stack, but
# keep it out of ~/Desktop, ~/Documents and ~/Downloads: macOS privacy
# controls (TCC) block background LaunchAgents from reading those.
base_dir: "{{ ansible_facts['user_dir'] }}/tools/observability"
bin_dir: "{{ base_dir }}/bin"
etc_dir: "{{ base_dir }}/etc"
var_dir: "{{ base_dir }}/var"
log_dir: "{{ var_dir }}/log"
# Release archives are staged here, not in the shared /tmp, and removed after
# extraction.
download_dir: "{{ var_dir }}/downloads"

# Per-user launchd. Plists go in the user's own LaunchAgents directory and are
# loaded into a per-user domain, never system/.
#
#   user  (default) user/<uid>: loadable over SSH without a console login;
#         plists carry LimitLoadToSessionType Background.
#   gui   gui/<uid>: only exists while this user is logged in at the console;
#         plists carry Aqua, so launchd also loads them at console login.
#
# See "LaunchAgent lifecycle" in docs/LAUNCHAGENT_VARIANT.md for what each
# means across logout and reboot.
launch_agents_dir: "{{ ansible_facts['user_dir'] }}/Library/LaunchAgents"
launchd_domain_type: user
launchd_domain: "{{ launchd_domain_type }}/{{ ansible_facts['user_uid'] }}"
# Distinct from the system-level deployment's com.observability.* LaunchDaemon
# labels, so the two can never be mistaken for each other in launchctl output,
# logs or plist names when they run side by side.
launchd_label_prefix: com.observability.user
victoriametrics_launchd_label: "{{ launchd_label_prefix }}.victoriametrics"
victoriametrics_launchd_plist: "{{ launch_agents_dir }}/{{ victoriametrics_launchd_label }}.plist"
grafana_launchd_label: "{{ launchd_label_prefix }}.grafana"
grafana_launchd_plist: "{{ launch_agents_dir }}/{{ grafana_launchd_label }}.plist"
# LaunchDaemon labels of the system-level deployment for the same services.
# Only ever read (stat / launchctl print) by preflight, never modified.
observability_legacy_daemon_labels:
  - com.observability.victoriametrics
  - com.observability.grafana

# VictoriaMetrics.
victoriametrics_version: "1.101.0"
victoriametrics_download_url: "https://github.com/VictoriaMetrics/VictoriaMetrics/releases/download/v{{ victoriametrics_version }}/victoria-metrics-darwin-arm64-v{{ victoriametrics_version }}.tar.gz"
# Upstream-published SHA256 (…_checksums.txt). Update on version bump.
victoriametrics_checksum: "sha256:91a443162e29f4a96dd1a564b81a96b0509fc7a46d522ab4f4d94a5fd867a438"
victoriametrics_install_dir: "{{ bin_dir }}/victoria-metrics-{{ victoriametrics_version }}"
# VictoriaMetrics deletes data older than this. Its own default is 1 month,
# which is easy to be surprised by; set it explicitly.
victoriametrics_retention: "90d"
# User-owned and separate from the system-level /opt/observability data, so
# the two stacks can never share a storage directory.
victoriametrics_data_dir: "{{ var_dir }}/victoriametrics"

# Grafana.
grafana_version: "13.2.0"
grafana_download_url: "https://dl.grafana.com/oss/release/grafana-{{ grafana_version }}.darwin-arm64.tar.gz"
# Upstream-published SHA256 (…tar.gz.sha256). Update on version bump.
grafana_checksum: "sha256:338201906b6fb997c58a63eab074d496a43561350ddd1d714b2ef510f3eddea2"
grafana_install_dir: "{{ base_dir }}/grafana-{{ grafana_version }}"
grafana_home: "{{ base_dir }}/grafana"
# 3000 normally; observability_side_by_side_grafana_port (3001) in
# side-by-side mode. Override directly for any other port.
grafana_port: "{{ observability_side_by_side_grafana_port | default(3001) if observability_side_by_side | default(false) | bool else 3000 }}"
# Matches the agent collection interval so Grafana picks a sensible step.
grafana_time_interval: "15s"
# Provisioned dashboard uids. The fleet dashboard links to the host detail
# dashboard (and back) by uid, so both templates read them from here.
grafana_fleet_dashboard_uid: mac-mini-fleet
grafana_detail_dashboard_uid: mac-mini-detail

# LLM (MLX-LM) dashboards and alert rules, fed by roles/observability_llm on
# the workers. Provisioned when any monitored node has llm_observability_enabled
# true; set explicitly to override. Turning them off removes the three
# dashboards and deletes the rules (Grafana keeps provisioned rules otherwise).
grafana_llm_dashboards_enabled: "{{ groups.get('monitored_nodes', []) | map('extract', hostvars) | map(attribute='llm_observability_enabled', default=false) | map('bool') | select | list | length > 0 }}"
grafana_llm_alerts_enabled: "{{ grafana_llm_dashboards_enabled }}"
grafana_llm_overview_dashboard_uid: llm-cluster-overview
grafana_llm_node_dashboard_uid: llm-node-detail
grafana_llm_performance_dashboard_uid: llm-performance-quality
grafana_llm_alert_folder: LLM Observability
observability_server_llm_dashboards:
  - llm_cluster_overview
  - llm_node_detail
  - llm_performance_quality

# Alert thresholds (templates/llm_alerts.yml.j2). Windows are fixed in the
# rules: 10 minutes for rates and quantiles, 15 minutes for restarts.
llm_alert_ttft_p95_seconds: 5
llm_alert_generation_p95_seconds: 120
llm_alert_error_rate_percent: 5
# Error-rate alert needs at least this many requests in the window.
llm_alert_min_requests: 5
# Only for nodes with llm_activity_expected: true.
llm_alert_inactivity_minutes: 60
# 1 = warning, 2 = critical (kern.memorystatus_vm_pressure_level).
llm_alert_memory_pressure_level: 2
llm_alert_restarts_per_15m: 2
llm_alert_stale_minutes: 10
# 2 = serious, 3 = critical (NSProcessInfo.thermalState).
llm_alert_thermal_state: 2

# Grafana takes noticeably longer than VictoriaMetrics on first boot (sqlite
# init plus provisioning), so it gets a longer readiness budget.
victoriametrics_ready_retries: 10
grafana_ready_retries: 30
service_ready_delay: 5

# launchd ProgramArguments, rendered into the shared plist template.
#
# -opentelemetry.usePrometheusNaming is load-bearing: without it VictoriaMetrics
# stores OTLP names verbatim, dots included (system.memory.usage, label
# host.name), and every dashboard query silently returns zero series.
victoriametrics_base_arguments:
  - "{{ bin_dir }}/victoria-metrics-prod"
  - "-storageDataPath={{ victoriametrics_data_dir }}"
  - "-httpListenAddr=:{{ victoriametrics_port }}"
  - "-retentionPeriod={{ victoriametrics_retention }}"
  - "-opentelemetry.usePrometheusNaming"

# Appended only when victoriametrics_auth_enabled. The password is read from a
# 0600 file rather than passed inline, so it stays out of the plist and out of
# `ps` output.
victoriametrics_auth_arguments:
  - "-httpAuth.username={{ victoriametrics_auth_username }}"
  - "-httpAuth.password=file://{{ etc_dir }}/victoriametrics-auth-password"

# Grafana 11+ removed the separate grafana-server binary; the unified `grafana`
# binary with the `server` subcommand replaces it.
grafana_program_arguments:
  - "{{ grafana_home }}/bin/grafana"
  - "server"
  - "--config={{ etc_dir }}/grafana/grafana.ini"
  - "--homepath={{ grafana_home }}"
