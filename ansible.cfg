[defaults]
inventory = inventories/production/hosts.yml
roles_path = roles
host_key_checking = False
retry_files_enabled = False
result_format = yaml

# No-sudo variant: nothing is installed or started with privilege
# escalation. Everything lands in the connecting user's home directory and
# runs as per-user LaunchAgents. site.yml also sets become: false per play,
# so a stray --become or ANSIBLE_BECOME=true cannot turn this into a root
# install.
[privilege_escalation]
become = False
