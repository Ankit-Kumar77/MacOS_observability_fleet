---
- name: Import prerequisites tasks
  ansible.builtin.import_tasks: prerequisites.yml
- name: Import victoriametrics tasks
  ansible.builtin.import_tasks: victoriametrics.yml
- name: Import grafana tasks
  ansible.builtin.import_tasks: grafana.yml

# Handlers normally run at the very end of the play, which would let verify.yml
# check services still running their previous configuration. Flush them here so
# verification always sees the state this run just produced.
- name: Apply pending service restarts before verification
  ansible.builtin.meta: flush_handlers

- name: Import verify tasks
  ansible.builtin.import_tasks: verify.yml
