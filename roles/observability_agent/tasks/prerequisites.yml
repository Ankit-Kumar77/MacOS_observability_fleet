---
- name: Assert the monitoring server group resolves to one addressable host
  ansible.builtin.assert:
    that:
      - groups.get('monitoring_server') | default([]) | length == 1
      - hostvars[groups['monitoring_server'][0]]['ansible_host'] is defined
    fail_msg: >-
      Monitored nodes derive their export endpoint from the monitoring_server
      group, which must contain exactly one host with ansible_host set.
      Found {{ groups.get('monitoring_server') | default([]) | length }} host(s).
  run_once: true
  delegate_to: localhost
  become: false

# Read-only checks: unprivileged user, per-user launchd domain present, no
# clash with a system-level deployment. Nothing is written until they pass.
# The collector listens only on its loopback telemetry port, which must be
# free (the system-level collector holds 8888); the VictoriaMetrics port it
# targets must also differ from the system-level one in side-by-side mode.
- name: Run the LaunchAgent / no-sudo preflight checks
  ansible.builtin.include_role:
    name: observability_common
    tasks_from: preflight
  vars:
    observability_service_labels:
      - "{{ otel_collector_launchd_label }}"
      - "{{ otel_ssh_state_launchd_label }}"
    observability_service_ports: "{{ {otel_collector_launchd_label: otel_internal_metrics_port | int} }}"
    observability_side_by_side_port_pairs:
      - {name: VictoriaMetrics (export target), port: "{{ victoriametrics_port }}", legacy_port: "{{ observability_legacy_victoriametrics_port }}"}
      - {name: Collector internal metrics, port: "{{ otel_internal_metrics_port }}", legacy_port: "{{ observability_legacy_otel_internal_metrics_port }}"}

# The MLX telemetry receiver is added to a collector that may already be
# running, which the preflight port check (not-yet-loaded agents only) does not
# cover. A port held by anything but our collector would leave the restarted
# collector failing. lsof sees this user's processes only; the end-to-end
# verification catches the rest.
- name: Check the MLX telemetry OTLP receiver port
  ansible.builtin.command:
    cmd: "lsof -nP -iTCP@127.0.0.1:{{ llm_otlp_receiver_port }} -sTCP:LISTEN -Fc"
  register: observability_agent_llm_port
  changed_when: false
  failed_when: false
  when: llm_observability_enabled | default(false) | bool

- name: Assert the MLX telemetry OTLP receiver port is free or held by the collector
  ansible.builtin.assert:
    that:
      - observability_agent_llm_port.stdout_lines | select('match', '^c') | reject('match', '^cotelcol') | list | length == 0
    fail_msg: >-
      Port {{ llm_otlp_receiver_port }} on 127.0.0.1 is held by another process
      ({{ observability_agent_llm_port.stdout_lines | select('match', '^c') | map('regex_replace', '^c', '') | join(', ') }}),
      so the collector could not open its MLX telemetry receiver. Pick a free
      llm_otlp_receiver_port in group_vars/all.yml.
  when: llm_observability_enabled | default(false) | bool

- name: Create the observability directory layout
  ansible.builtin.include_role:
    name: observability_common
    tasks_from: base_directories
