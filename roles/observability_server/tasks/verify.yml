---
# KeepAlive restarts a crashing agent forever, so "loaded" alone proves little;
# require launchd to report the process as running in this user's domain.
- name: Verify the server LaunchAgents are running in the per-user launchd domain
  ansible.builtin.command:
    cmd: "launchctl print {{ launchd_domain }}/{{ item }}"
  register: observability_server_agent_state
  until: observability_server_agent_state.rc == 0 and 'state = running' in observability_server_agent_state.stdout
  retries: 5
  delay: 2
  changed_when: false
  loop:
    - "{{ victoriametrics_launchd_label }}"
    - "{{ grafana_launchd_label }}"
  tags: ['verify']

# /health is deliberately exempt from VictoriaMetrics basic auth, so this stays
# an unauthenticated probe even when authentication is enabled.
- name: Wait for VictoriaMetrics to become ready
  ansible.builtin.uri:
    url: "http://localhost:{{ victoriametrics_port }}/health"
    method: GET
    status_code: 200
  register: observability_server_vm_health
  until: observability_server_vm_health.status is defined and observability_server_vm_health.status == 200
  retries: "{{ victoriametrics_ready_retries }}"
  delay: "{{ service_ready_delay }}"
  tags: ['verify']

- name: Verify the VictoriaMetrics query API accepts the configured credentials
  ansible.builtin.uri:
    url: "http://localhost:{{ victoriametrics_port }}/api/v1/labels"
    url_username: "{{ victoriametrics_auth_username }}"
    url_password: "{{ victoriametrics_auth_password }}"
    force_basic_auth: true
    method: GET
    status_code: 200
  when: victoriametrics_auth_enabled
  tags: ['verify']

- name: Verify the VictoriaMetrics query API rejects unauthenticated access
  ansible.builtin.uri:
    url: "http://localhost:{{ victoriametrics_port }}/api/v1/labels"
    method: GET
    status_code: 401
  when: victoriametrics_auth_enabled
  tags: ['verify']

- name: Wait for Grafana to become ready
  ansible.builtin.uri:
    url: "http://localhost:{{ grafana_port }}/api/health"
    method: GET
    status_code: 200
  register: observability_server_grafana_health
  until: observability_server_grafana_health.status is defined and observability_server_grafana_health.status == 200
  retries: "{{ grafana_ready_retries }}"
  delay: "{{ service_ready_delay }}"
  tags: ['verify']

- name: Verify Grafana datasource configuration exists
  ansible.builtin.uri:
    url: "http://localhost:{{ grafana_port }}/api/datasources"
    url_username: admin
    url_password: "{{ grafana_admin_password }}"
    force_basic_auth: true
    method: GET
    status_code: 200
  register: observability_server_datasources
  until: observability_server_datasources.json is defined and 'VictoriaMetrics' in (observability_server_datasources.json | map(attribute='name') | list)
  retries: "{{ grafana_ready_retries }}"
  delay: "{{ service_ready_delay }}"
  no_log: true
  tags: ['verify']

- name: Verify every dashboard was provisioned
  ansible.builtin.uri:
    url: "http://localhost:{{ grafana_port }}/api/dashboards/uid/{{ item.uid }}"
    url_username: admin
    url_password: "{{ grafana_admin_password }}"
    force_basic_auth: true
    method: GET
    status_code: 200
  register: observability_server_dashboard
  until: observability_server_dashboard.status is defined and observability_server_dashboard.status == 200
  retries: "{{ grafana_ready_retries }}"
  delay: "{{ service_ready_delay }}"
  loop: "{{ observability_server_dashboards | rejectattr('llm') | list
            + (observability_server_dashboards | selectattr('llm') | list if grafana_llm_dashboards_enabled | bool else []) }}"
  loop_control:
    label: "{{ item.folder }}/{{ item.uid }}"
  no_log: true
  tags: ['verify']

- name: Read the provisioned alert rules
  ansible.builtin.uri:
    url: "http://localhost:{{ grafana_port }}/api/v1/provisioning/alert-rules"
    url_username: admin
    url_password: "{{ grafana_admin_password }}"
    force_basic_auth: true
    method: GET
    status_code: 200
  register: observability_server_alert_rules
  no_log: true
  tags: ['verify']

- name: Assert the fleet alert rules are loaded
  ansible.builtin.assert:
    that:
      - (observability_server_alert_rules.json | selectattr('uid', 'match', '^fleet-') | list | length) > 0
    fail_msg: >-
      Grafana has no fleet-* alert rules. Check fleet_alerts.yml under
      {{ etc_dir }}/grafana/provisioning/alerting and Grafana's log.
    quiet: true
  when: grafana_fleet_alerts_enabled | bool
  tags: ['verify']

- name: Report server verification success
  ansible.builtin.debug:
    msg: >-
      VictoriaMetrics (port {{ victoriametrics_port }}) and Grafana (port
      {{ grafana_port }}) are running as LaunchAgents in {{ launchd_domain }},
      the VictoriaMetrics datasource is registered, every dashboard is
      provisioned and the alert rules are loaded.
  tags: ['verify']
