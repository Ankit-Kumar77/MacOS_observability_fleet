---
- name: Restart VictoriaMetrics
  ansible.builtin.include_tasks:
    file: "{{ role_path }}/../observability_common/tasks/launchd_restart.yml"
  vars:
    launchd_service_label: "{{ victoriametrics_launchd_label }}"
    launchd_service_plist: "{{ victoriametrics_launchd_plist }}"

- name: Restart Grafana
  ansible.builtin.include_tasks:
    file: "{{ role_path }}/../observability_common/tasks/launchd_restart.yml"
  vars:
    launchd_service_label: "{{ grafana_launchd_label }}"
    launchd_service_plist: "{{ grafana_launchd_plist }}"
