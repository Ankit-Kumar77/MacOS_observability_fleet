---
- name: Verify the MLX telemetry agent is running in the per-user launchd domain
  ansible.builtin.command:
    cmd: "launchctl print {{ launchd_domain }}/{{ mlx_telemetry_launchd_label }}"
  register: observability_llm_agent_state
  until: observability_llm_agent_state.rc == 0 and 'state = running' in observability_llm_agent_state.stdout
  retries: 5
  delay: 2
  changed_when: false
  tags: ['verify']

- name: Verify the telemetry proxy answers
  ansible.builtin.uri:
    url: "http://{{ '127.0.0.1' if mlx_telemetry_host in ['0.0.0.0', '::'] else mlx_telemetry_host }}:{{ mlx_telemetry_port }}/-/mlx-telemetry/status"
    method: GET
    status_code: 200
  register: observability_llm_status
  until: observability_llm_status.status | default(-1) == 200
  retries: 5
  delay: 2
  when: llm_metrics_enabled | bool
  tags: ['verify']

# Forwarded unchanged, so this shows the proxy reaches the server (401 from
# an API-key-protected MLX-VLM is forwarded too).
- name: Verify the proxy forwards to the inference server
  ansible.builtin.uri:
    url: "http://{{ '127.0.0.1' if mlx_telemetry_host in ['0.0.0.0', '::'] else mlx_telemetry_host }}:{{ mlx_telemetry_port }}/health"
    method: GET
    status_code: [200, 401]
  when: llm_metrics_enabled | bool and llm_require_mlx_reachable | bool
  tags: ['verify']

# The collector reports the OS hostname (often with a .local suffix), so match
# this host's short name with any suffix (characters other than letters,
# digits and '-' match any character, which keeps the PromQL string simple). VictoriaMetrics hides the most recent
# ~30 s of samples from instant queries, hence the retry budget.
- name: Wait for MLX telemetry to arrive in VictoriaMetrics
  ansible.builtin.uri:
    url: "http://{{ monitoring_server_address }}:{{ victoriametrics_port }}/api/v1/query?query={{ observability_llm_query | urlencode }}"
    url_username: "{{ victoriametrics_auth_username if victoriametrics_auth_enabled else omit }}"
    url_password: "{{ victoriametrics_auth_password if victoriametrics_auth_enabled else omit }}"
    force_basic_auth: "{{ victoriametrics_auth_enabled }}"
    method: GET
    status_code: 200
  vars:
    observability_llm_query: >-
      max by (host_name) (mlx_telemetry_up{host_name=~"(?i){{ ansible_facts['hostname'] | regex_replace('[^A-Za-z0-9-]', '.') }}([.].*)?"})
  register: observability_llm_vm
  until: observability_llm_vm.json is defined and (observability_llm_vm.json.data.result | default([]) | length) > 0
  retries: 9
  delay: 10
  no_log: "{{ victoriametrics_auth_enabled }}"
  tags: ['verify']

# Read again: the first status answer can precede the agent's first health
# tick, which is when the framework is detected.
- name: Read the detected framework from the telemetry proxy
  ansible.builtin.uri:
    url: "http://{{ '127.0.0.1' if mlx_telemetry_host in ['0.0.0.0', '::'] else mlx_telemetry_host }}:{{ mlx_telemetry_port }}/-/mlx-telemetry/status"
    method: GET
    status_code: 200
  register: observability_llm_status
  when: llm_metrics_enabled | bool
  tags: ['verify']

- name: Report MLX telemetry verification success
  ansible.builtin.debug:
    msg: >-
      MLX telemetry is running as {{ mlx_telemetry_launchd_label }} in
      {{ launchd_domain }} and reaching VictoriaMetrics as host
      {{ observability_llm_vm.json.data.result | map(attribute='metric.host_name') | join(', ') }}
      (framework {{ observability_llm_status.json.framework | default('n/a') }},
      detected from {{ observability_llm_status.json.framework_source | default('n/a') }}).
      {% if llm_metrics_enabled | bool %}Point clients at
      http://{{ mlx_telemetry_host }}:{{ mlx_telemetry_port }}/v1 to measure their
      requests (the server itself stays on {{ mlx_server_host }}:{{ mlx_server_port }}).{% endif %}
  tags: ['verify']
