---
# Idempotently bootstraps a per-user LaunchAgent into the deployment user's
# launchd domain if it is not already loaded there. ansible.builtin.service has
# no macOS implementation -- "get_service_tools not implemented on target
# platform" -- so this drives launchctl directly. Every call targets the
# connecting user's own domain (launchd_domain, e.g. user/501), never system/.
#
# Required variables:
#   launchd_service_label   The Label declared in the plist, e.g.
#                           com.observability.user.victoriametrics.
#   launchd_service_plist   Absolute path to the rendered plist.
#   launchd_domain          Target domain, e.g. user/501 (role default).
#   launchd_domain_type     user or gui (role default).
#
# RunAtLoad is always true in launchd_agent.plist.j2 (with KeepAlive, or
# StartInterval for periodic jobs), so a bootstrapped agent starts immediately.
# Unlike a system LaunchDaemon it is not started at boot -- see "LaunchAgent
# lifecycle" in docs/LAUNCHAGENT_VARIANT.md.

- name: Check whether launchd has already loaded {{ launchd_service_label }}
  ansible.builtin.command:
    cmd: "launchctl print {{ launchd_domain }}/{{ launchd_service_label }}"
  register: observability_launchd_status
  changed_when: false
  failed_when: false

# Only reachable if launchd_domain_type was switched after a previous run.
# Without this the old copy keeps running beside the new one: two collectors
# double-report, and two VictoriaMetrics or Grafana instances fight over one
# port and one data directory. Both domains belong to the same user.
- name: Unload from the other per-user launchd domain {{ launchd_service_label }}
  ansible.builtin.command:
    cmd: "launchctl bootout {{ 'user' if launchd_domain_type == 'gui' else 'gui' }}/{{ ansible_facts['user_uid'] }}/{{ launchd_service_label }}"
  register: observability_launchd_other_domain
  changed_when: observability_launchd_other_domain.rc == 0
  failed_when: false
  when: observability_launchd_status.rc != 0

- name: Bootstrap into the per-user launchd domain {{ launchd_service_label }}
  ansible.builtin.command:
    cmd: "launchctl bootstrap {{ launchd_domain }} {{ launchd_service_plist }}"
  when: observability_launchd_status.rc != 0
  changed_when: true
