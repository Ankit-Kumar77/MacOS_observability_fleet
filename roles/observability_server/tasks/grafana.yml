---
- name: Install the Grafana release
  ansible.builtin.include_role:
    name: observability_common
    tasks_from: install_versioned_archive
  vars:
    observability_archive_component: Grafana
    observability_archive_url: "{{ grafana_download_url }}"
    observability_archive_checksum: "{{ grafana_checksum }}"
    observability_archive_tmp_path: "{{ download_dir }}/grafana-{{ grafana_version }}.tar.gz"
    observability_archive_install_dir: "{{ grafana_install_dir }}"
    observability_archive_binary_path: "{{ grafana_install_dir }}/bin/grafana"
    # The Grafana tarball nests everything under a grafana-<version>/ prefix.
    observability_archive_extra_opts:
      - "--strip-components=1"

# The symlink flip -- not the extraction -- is the moment the running version
# changes, which is why the restart is notified from here.
- name: Point the active Grafana installation at this version
  ansible.builtin.file:
    src: "{{ grafana_install_dir }}"
    dest: "{{ grafana_home }}"
    state: link
    follow: false
    force: true
  notify: Restart Grafana

# 0600: contains the Grafana admin password in plaintext.
- name: Generate Grafana configuration
  ansible.builtin.template:
    src: grafana.ini.j2
    dest: "{{ etc_dir }}/grafana/grafana.ini"
    mode: '0600'
  no_log: true
  notify: Restart Grafana

# 0600: carries the VictoriaMetrics basic-auth password when auth is enabled.
- name: Provision VictoriaMetrics datasource
  ansible.builtin.template:
    src: datasource.yml.j2
    dest: "{{ etc_dir }}/grafana/provisioning/datasources/victoriametrics.yml"
    mode: '0600'
  no_log: "{{ victoriametrics_auth_enabled }}"
  notify: Restart Grafana

- name: Provision Grafana dashboard provider
  ansible.builtin.template:
    src: dashboard_provider.yml.j2
    dest: "{{ etc_dir }}/grafana/provisioning/dashboards/provider.yml"
    mode: '0644'
  notify: Restart Grafana

# Dashboards live in one sub-directory per Grafana folder (Fleet, LLM,
# Platform); the provider maps directories to folders. uids are fixed in the
# templates, so links keep working when a dashboard changes folder.
- name: Create the dashboard folders
  ansible.builtin.file:
    path: "{{ etc_dir }}/grafana/provisioning/dashboards/{{ item }}"
    state: directory
    mode: '0755'
  loop: "{{ (observability_server_dashboards | rejectattr('llm') | list
             + (observability_server_dashboards | selectattr('llm') | list if grafana_llm_dashboards_enabled | bool else []))
            | map(attribute='folder') | unique | list }}"

# Before folders, every dashboard was one file at the top level. Removed
# first, so Grafana never sees the same uid in two files.
- name: Remove dashboards provisioned before the folder layout
  ansible.builtin.file:
    path: "{{ etc_dir }}/grafana/provisioning/dashboards/{{ item }}"
    state: absent
  loop: "{{ observability_server_legacy_dashboard_files }}"
  notify: Restart Grafana

- name: Provision dashboards
  ansible.builtin.template:
    src: "{{ item.template }}.json.j2"
    dest: "{{ etc_dir }}/grafana/provisioning/dashboards/{{ item.folder }}/{{ item.file | default(item.template) }}.json"
    mode: '0644'
    validate: "{{ ansible_facts['python']['executable'] }} -c 'import json, sys; json.load(open(sys.argv[1]))' %s"
  loop: "{{ observability_server_dashboards | rejectattr('llm') | list
            + (observability_server_dashboards | selectattr('llm') | list if grafana_llm_dashboards_enabled | bool else []) }}"
  loop_control:
    label: "{{ item.folder }}/{{ item.file | default(item.template) }}"
  notify: Restart Grafana

# LLM dashboards are removed (and so deleted by the provider) when disabled.
- name: Remove LLM dashboards when LLM observability is off
  ansible.builtin.file:
    path: "{{ etc_dir }}/grafana/provisioning/dashboards/{{ item.folder }}/{{ item.file | default(item.template) }}.json"
    state: absent
  loop: "{{ observability_server_dashboards | selectattr('llm') | list }}"
  loop_control:
    label: "{{ item.folder }}/{{ item.file | default(item.template) }}"
  when: not (grafana_llm_dashboards_enabled | bool)
  notify: Restart Grafana

# Host-level rules for every Mac; always rendered (as deleteRules when
# grafana_fleet_alerts_enabled is false).
- name: Provision fleet alert rules
  ansible.builtin.template:
    src: fleet_alerts.yml.j2
    dest: "{{ etc_dir }}/grafana/provisioning/alerting/fleet_alerts.yml"
    mode: '0644'
    validate: "{{ ansible_facts['python']['executable'] }} -c 'import json, sys; d = json.load(open(sys.argv[1])); assert d[\"apiVersion\"] == 1 and (d.get(\"groups\") or d.get(\"deleteRules\"))' %s"
  notify: Restart Grafana

- name: Check for previously provisioned LLM alert rules
  ansible.builtin.stat:
    path: "{{ etc_dir }}/grafana/provisioning/alerting/llm_alerts.yml"
  register: observability_server_llm_alerts_file

# When alerts are turned off after having been on, the file is rewritten to
# list the rule uids under deleteRules: removing a provisioning file does not
# delete the rules Grafana already created. Servers that never enabled LLM
# observability get no file and no Grafana restart.
- name: Provision LLM alert rules
  ansible.builtin.template:
    src: llm_alerts.yml.j2
    dest: "{{ etc_dir }}/grafana/provisioning/alerting/llm_alerts.yml"
    mode: '0644'
    # Grafana does not start at all if an alerting file fails to parse.
    validate: "{{ ansible_facts['python']['executable'] }} -c 'import json, sys; d = json.load(open(sys.argv[1])); assert d[\"apiVersion\"] == 1 and (d.get(\"groups\") or d.get(\"deleteRules\"))' %s"
  when: grafana_llm_alerts_enabled | bool or observability_server_llm_alerts_file.stat.exists
  notify: Restart Grafana

- name: Generate Grafana LaunchAgent plist
  ansible.builtin.template:
    src: "{{ role_path }}/../observability_common/templates/launchd_agent.plist.j2"
    dest: "{{ grafana_launchd_plist }}"
    mode: '0644'
  vars:
    launchd_label: "{{ grafana_launchd_label }}"
    launchd_working_directory: "{{ grafana_home }}"
    launchd_program_arguments: "{{ grafana_program_arguments }}"
    launchd_stdout_log: "{{ log_dir }}/grafana.out.log"
    launchd_stderr_log: "{{ log_dir }}/grafana.err.log"
  notify: Restart Grafana

- name: Ensure Grafana is loaded in the per-user launchd domain
  ansible.builtin.include_role:
    name: observability_common
    tasks_from: launchd_ensure_started
  vars:
    launchd_service_label: "{{ grafana_launchd_label }}"
    launchd_service_plist: "{{ grafana_launchd_plist }}"
